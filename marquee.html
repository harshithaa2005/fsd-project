
<!DOCTYPE html>
<html>
<head>
    <title>Expanding Cards</title>
    <style>
        /* Center the images and add spacing */
        marquee img {
            display: inline-block; /* Use inline-block to allow margin */
             /* Ensure images fit within the marquee */
            height: auto; /* Maintain aspect ratio */
        }
    </style>
</head>
<body>

<marquee behavior="scroll" direction="left" scrollamount="20" width="100%" height="100%">
    <img src="https://wallpapers.com/images/featured/4k-car-g6a4f0e15hkua5oa.jpg" alt="Image 1"  height="100">
    <img src="https://images.pexels.com/photos/1035108/pexels-photo-1035108.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Image 2 ">
    <img src="https://images.pexels.com/photos/761815/pexels-photo-761815.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Image 3">
</marquee>

</body>
</html>
