<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            overflow: hidden; /* Prevent scrollbars */
            position: relative; /* For positioning the button */
        }

        .carousel {
            display: flex;
            overflow: hidden;
            width: 100%;
            height: 200px; /* Set a fixed height for the carousel */
            position: relative;
        }

        .carousel-inner {
            display: flex;
            animation: scroll 15s linear infinite; /* Animation for scrolling */
        }

        .carousel img {
            width: 300px; /* Set a fixed width for all images */
            height: 200px; /* Set a fixed height for all images */
            object-fit: cover; /* Maintain aspect ratio and cover the area */
            margin-right: 10px; /* Space between images */
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        /* Back button styles */
        .back-button {
            position: absolute;
            top: 20px; /* Distance from the top */
            right: 20px; /* Distance from the right */
            padding: 10px 15px;
            background-color: #007BFF; /* Button color */
            color: white; /* Text color */
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s; /* Smooth transition */
        }

        .back-button:hover {
            background-color: #0056b3; /* Darker shade on hover */
        }
    </style>
</head>
<body>

<div class="carousel">
    <div class="carousel-inner">
        <img src="https://wallpapers.com/images/featured/4k-car-g6a4f0e15hkua5oa.jpg" alt="Car Image 1">
        <img src="https://images.pexels.com/photos/1035108/pexels-photo-1035108.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Car Image 2">
        <img src="https://images.pexels.com/photos/761815/pexels-photo-761815.jpeg?auto=compress&cs=tinysrgb&w=600" alt="Car Image 3">
      
       
    </div>
</div>

<!-- Back Button -->
<a href="main.html"><button class="back-button" onclick="window.history.back();">Back</button></a>

</body>
</html>
