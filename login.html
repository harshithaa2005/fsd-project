<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <style>
    /* Centering the content */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0; /* Light background color */
      flex-direction: column; /* Align elements vertically */
      position: relative; /* Allows absolute positioning of the Home button */
    }

    /* Styling the Home button */
    .home-button {
      position: absolute; /* Absolute positioning */
      right: 20px; /* Position the button 20px from the right */
      top: 20px; /* Position the button 20px from the top */
      background-color: #2196F3; /* Blue color */
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      text-align: center;
      text-decoration: none;
    }

    .home-button:hover {
      background-color: #1976D2; /* Slightly darker blue on hover */
    }

    /* Styling the form */
    .form-container {
      text-align: center;
      background-color: lightblue;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    /* Styling the login button */
    .login-button {
      background-color: #4CAF50; /* Green color */
      color: white; /* Fixed text color */
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      text-align: center;
    }

    .login-button:hover {
      background-color: #45a049; /* Slightly darker green on hover */
    }

    .input-field {
      width: 280px;
      padding: 8px;
      margin: 10px 0;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    /* Styling the register link */
    .register-link {
      font-size: 14px;
      color: #090d10;
      text-decoration: none;
    }

    .register-link:hover {
      text-decoration: underline;
    }

    /* Styling the back button */
    .back-button {
      background-color: #f44336; /* Red color */
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      text-align: center;
      margin-top: 10px;
    }

    .back-button:hover {
      background-color: #d32f2f; /* Slightly darker red on hover */
    }
  </style>
</head>
<body>

  <!-- Home Button at the top right -->
  <a href="main.html" class="home-button">Home</a>

  <div class="form-container">
    <h1>Login</h1>

    <label for="email">Email:</label><br>
    <input type="email" id="email" class="input-field" placeholder="Enter your email"><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" class="input-field" placeholder="Enter your password"><br>

    <button class="login-button">Login</button><br><br>

    <a href="email.html" class="register-link">Don't have an account? Register here</a><br><br>
  </div>

</body>
</html>
